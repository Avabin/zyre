name: Development Environment Setup

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/copilot-setup-steps.yml'

jobs:
  copilot-setup-steps:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.12']
        dotnet-version: ['9.0.x']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Install C/C++ build tools (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential libtool pkg-config autotools-dev autoconf automake cmake uuid-dev libpcre3-dev valgrind

      - name: Install C/C++ build tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake zeromq

      - name: Install C/C++ build tools (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System'
          choco install zeromq

      - name: Build and install libsodium (Unix)
        if: runner.os != 'Windows'
        run: |
          git clone --depth 1 -b stable https://github.com/jedisct1/libsodium.git
          cd libsodium
          ./autogen.sh && ./configure && make check
          sudo make install
          cd ..

      - name: Build and install libzmq (Unix)
        if: runner.os != 'Windows'
        run: |
          git clone https://github.com/zeromq/libzmq.git
          cd libzmq
          ./autogen.sh
          ./configure --with-libsodium
          make check
          sudo make install
          sudo ldconfig || true
          cd ..

      - name: Build and install czmq (Unix)
        if: runner.os != 'Windows'
        run: |
          git clone https://github.com/zeromq/czmq.git
          cd czmq
          ./autogen.sh && ./configure && make check
          sudo make install
          sudo ldconfig || true
          cd ..

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build pytest pytest-cov black ruff pyzmq

      - name: Configure CMake
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build native libraries (Unix)
        if: runner.os != 'Windows'
        run: |
          ./autogen.sh && ./configure && make check
          sudo make install
          sudo ldconfig || true

      - name: Build native libraries (Windows)
        if: runner.os == 'Windows'
        run: |
            git clone --depth 1 -b stable https://github.com/jedisct1/libsodium.git
            git clone https://github.com/zeromq/libzmq.git
            git clone https://github.com/zeromq/czmq.git
            git clone https://github.com/zeromq/zyre.git
            cd zyre\builds\msvc
            configure.bat
            cd build
            buildall.bat
            cd ..\..\..\..
      - name: Verify setup
        run: |
          python --version
          dotnet --version
          cmake --version
          echo "Development environment ready!"